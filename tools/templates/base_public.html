<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{% block title %}Veylora AI{% endblock %}</title>
<meta name="description" content="{% block meta_description %}Independent AI tool reviews, comparisons and practical guides for creators.{% endblock %}">
<meta name="robots" content="index,follow,max-image-preview:large">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9101955435716307" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;background:#070b14;color:#eef2ff;line-height:1.7}a{color:inherit;text-decoration:none}.wrap{width:min(1120px,90%);margin:auto}
header{position:sticky;top:0;z-index:20;background:rgba(7,11,20,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.08)}.nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}.logo{font-size:25px;font-weight:800}.logo span,.grad{background:linear-gradient(90deg,#00d4ff,#7b5cff,#d946ef);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.links{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.links a{font-size:14px;color:#b7c0d4}.links a:hover{color:#fff}
.hero{padding:76px 0 48px}.eyebrow{display:inline-block;padding:7px 11px;border:1px solid rgba(123,92,255,.28);background:rgba(123,92,255,.09);border-radius:999px;color:#bcb3ff;font-size:12px;font-weight:700;margin-bottom:16px}.hero h1{font-size:clamp(38px,7vw,64px);line-height:1.08;max-width:900px;letter-spacing:-1.5px}.hero p{max-width:780px;color:#aeb8cc;font-size:17px;margin-top:18px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}.btn{display:inline-flex;padding:12px 18px;border-radius:10px;font-weight:700;font-size:14px;border:1px solid rgba(255,255,255,.1)}.btn.primary{background:linear-gradient(90deg,#6156ff,#8259ff);border-color:transparent}.btn.secondary{background:rgba(255,255,255,.035);color:#c4cbda}
section{margin:34px 0 56px}.section-head{margin-bottom:20px}.section-head h2{font-size:30px}.section-head p{color:#9eabc0;max-width:760px;margin-top:7px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.grid.two{grid-template-columns:repeat(2,1fr)}.card{padding:24px;border:1px solid rgba(255,255,255,.08);border-radius:18px;background:linear-gradient(145deg,rgba(17,24,40,.9),rgba(10,15,28,.92))}.card h3{font-size:19px;margin-bottom:9px}.card h2{font-size:24px;margin-bottom:10px}.card p{color:#a7b1c4}.card ul{padding-left:20px;color:#a7b1c4}.tag{display:inline-block;margin-top:14px;padding:6px 9px;border-radius:8px;background:rgba(123,92,255,.1);color:#bcb3ff;font-size:12px}.tool-card img{width:48px;height:48px;object-fit:contain;border-radius:10px;background:#fff;padding:4px;margin-bottom:12px}.tool-card .btn{margin-top:18px}.search{display:flex;gap:10px;margin-top:22px;max-width:650px}.search input{flex:1;padding:13px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:#0d1422;color:white}.search button{padding:13px 18px;border:0;border-radius:10px;background:#6c63ff;color:#fff;font-weight:700}
.article{max-width:850px}.article h2{margin:34px 0 10px;font-size:27px}.article p{color:#b3bdd0;margin-bottom:16px}.article ul{padding-left:22px;color:#b3bdd0}.article li{margin:8px 0}.note{padding:18px 20px;border:1px solid rgba(0,212,255,.15);background:rgba(0,212,255,.04);border-radius:14px;color:#9eabc0;margin-top:22px}.crumbs{font-size:13px;color:#7f8ba0;margin:28px 0 0}.crumbs a{color:#aeb8cc}.split{display:grid;grid-template-columns:1.25fr .75fr;gap:20px}.list{display:grid;gap:9px;list-style:none;padding:0}.list li{padding:11px 13px;border-radius:10px;background:rgba(255,255,255,.025);color:#b5bfd1;border:1px solid rgba(255,255,255,.055)}
footer{border-top:1px solid rgba(255,255,255,.08);padding:34px 0 45px;color:#7f899b;font-size:13px}.footer-links{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px}
@media(max-width:800px){.grid,.grid.two,.split{grid-template-columns:1fr}.links a:not(.account){display:none}.hero{padding-top:48px}.search{flex-direction:column}}
</style></head><body>
<header><div class="wrap nav"><a class="logo" href="/">Veylora <span>AI</span></a><nav class="links"><a href="/">Home</a><a href="/ai-image-tools/">Image Tools</a><a href="/ai-video-tools/">Video Tools</a><a href="/guides/">Guides</a><a href="/about/">About</a>{% if user.is_authenticated %}<a class="account" href="/profile/">My Account</a>{% else %}<a class="account" href="/login/">Login</a>{% endif %}</nav></div></header>
<main class="wrap">{% block content %}{% endblock %}</main>
<footer><div class="wrap"><div class="footer-links"><a href="/">Home</a><a href="/guides/">Guides</a><a href="/about/">About</a><a href="/privacy/">Privacy</a><a href="/terms/">Terms</a><a href="/disclaimer/">Disclaimer</a><a href="/contact/">Contact</a></div><div>© 2026 Veylora AI. Independent AI tool research and workflow guides.</div></div></footer>
</body></html>
